; LVGL render test on the SenseCAP Indicator panel, using the verified display
; config from tools/esp32-display-test. Draws a mock Fuel Finder UI (header + station
; list + geo: QR) with dummy data to validate LVGL 8.4 + lv_qrcode before porting the
; same UI code into the main app.
[env:lvgl-test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0

board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
    hideakitai/PCA95x5
    lvgl/lvgl@^8.4.0
