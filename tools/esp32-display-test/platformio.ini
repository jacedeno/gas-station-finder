; Display bring-up ("first light") for the SenseCAP Indicator ST7701S RGB panel.
; Draws solid colours + text via Arduino_GFX, with CS/RST on the PCA9535 I2C expander.
; Once this shows a clean image, LVGL goes on top in the main app.
[env:display-test]
; pioarduino = arduino-esp32 3.x core (the official espressif32 6.x is stuck on
; core 2.0.17, where Arduino_GFX has no RGB bounce buffer -> striping/tearing).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0

board_build.flash_size = 8MB
; The panel framebuffer lives in the Indicator's octal (OPI) PSRAM.
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    ; 1.4.x+ adds the RGB bounce buffer (needs arduino-esp32 3.x).
    moononournation/GFX Library for Arduino@^1.4.9
    hideakitai/PCA95x5
