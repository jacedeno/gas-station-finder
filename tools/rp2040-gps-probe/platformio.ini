; Throwaway diagnostic firmware for the RP2040 on the SenseCAP Indicator.
; Purpose: confirm which Grove port the Air530Z GPS is plugged into by reading
; RP2040 UART1 (the Grove(IIC) pins) and echoing NMEA to USB serial.
;
; Uses the earlephilhower arduino-pico core (has a board def for the Indicator).
[env:probe]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_indicator_rp2040
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
