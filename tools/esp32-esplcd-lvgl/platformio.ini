; Clean esp_lcd display bring-up for the SenseCAP Indicator (ST7701S 480x480 RGB).
;
; This is the "port Seeed's reference" path (CLAUDE.md display work / docs/STATUS.md):
; the panel is driven directly through Espressif's esp_lcd RGB API with a DOUBLE
; framebuffer + refresh-on-demand + on_vsync — NOT Arduino_GFX (single-fb + bounce
; buffer, which tore/blurred under LVGL; see tools/esp32-lvgl-test, a documented
; dead-end). The two framebuffers are wired directly as LVGL's two draw buffers.
;
; All config values come from the Seeed ESP-IDF SDK, transcribed in
; docs/hardware/display.md ("Port spec"). esp_lcd ships inside the arduino-esp32 3.x
; core, so we keep the Arduino framework and call esp_lcd_* directly.
[env:esplcd-lvgl]
; pioarduino: arduino-esp32 core 3.x (the official espressif32 6.x ships core 2.0.17,
; whose esp_lcd is older and whose Arduino_GFX has no bounce buffer). Same platform
; pin that tools/esp32-lvgl-test verified on-device.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0

board_build.flash_size = 8MB
; Indicator ESP32-S3 = QIO flash + OPI (octal) PSRAM. The RGB framebuffers live in PSRAM.
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DCORE_DEBUG_LEVEL=3

; No Arduino_GFX here — esp_lcd is part of the core. Only the I2C expander + LVGL.
lib_deps =
    hideakitai/PCA95x5
    lvgl/lvgl@^8.4.0
