; Throwaway diagnostic for the ESP32-S3 on the SenseCAP Indicator.
; Purpose: empirically confirm which ESP32-S3 GPIO is the RX of the inter-processor
; UART from the RP2040 (ESPHome says the link is on GPIO19/20 but not which is which).
; It listens on each candidate RX pin and reports where the RP2040's "FIX,..." lines
; arrive. Requires the RP2040 to be running firmware/rp2040 (emitting FIX @ ~1 Hz).
[env:link-probe]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
build_flags = -DCORE_DEBUG_LEVEL=0
