; RP2040 firmware for the SenseCAP Indicator — GPS reader / forwarder.
;
; Reads the Air530Z GPS on UART1 (Grove(IIC) pins GPIO20/21) and forwards clean
; fixes to the ESP32-S3 over UART0 (GPIO16/17) using the FIX line protocol
; (see ../PROTOCOL.md). Mirrors output to USB serial for debugging.
[env:rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_indicator_rp2040
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0
