; ESP32-S3 firmware for the SenseCAP Indicator — the main Fuel Finder app.
;
; NOTE: there is no official PlatformIO board for the Indicator's ESP32-S3, so we
; use a generic ESP32-S3 board (8 MB flash, embedded PSRAM).
;
; The UI now drives the real ST7701S panel via esp_lcd + LVGL (the clean path ported
; from Seeed in tools/esp32-esplcd-lvgl; see docs/hardware/display.md). That requires
; the pioarduino arduino-esp32 core 3.x platform — the official espressif32 6.x ships
; core 2.0.17, whose esp_lcd is older. Same platform pin verified on-device.
[env:esp32-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
; The Indicator's ESP32-S3 has 8 MB *octal* (OPI) embedded PSRAM + quad (QIO) flash.
; The generic board assumes quad PSRAM -> "wrong PSRAM line mode" at boot. Confirmed
; on-device 2026-06-03. qio_opi = QIO flash + OPI PSRAM.
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    lvgl/lvgl@^8.4.0
    hideakitai/PCA95x5

; Host-side unit tests for the framework-agnostic geometry: `pio test -e native`.
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<geo/>
build_flags = -I src
