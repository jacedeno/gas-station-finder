; ESP32-S3 firmware for the SenseCAP Indicator — the main Fuel Finder app.
;
; NOTE: there is no official PlatformIO board for the Indicator's ESP32-S3, so we
; use a generic ESP32-S3 board (8 MB flash, embedded PSRAM). This is enough to
; build/run the non-UI logic. The RGB panel driver + LVGL config are still pending
; (CLAUDE.md #4/#5); the UI layer is a serial-log stub until then.
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
; The Indicator's ESP32-S3 has 8 MB *octal* (OPI) embedded PSRAM + quad (QIO) flash.
; The generic board assumes quad PSRAM -> "wrong PSRAM line mode" at boot. Confirmed
; on-device 2026-06-03. qio_opi = QIO flash + OPI PSRAM.
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; Host-side unit tests for the framework-agnostic geometry: `pio test -e native`.
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<geo/>
build_flags = -I src
